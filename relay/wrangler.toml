# Autoscroll sync relay. Dev: `npx wrangler@4 dev` (ws://localhost:8787, which pages
# served from localhost use). Deploy: `npx wrangler@4 deploy`, then put the
# *.workers.dev address in RELAY in scripts/sync.js.
name = "karaoke-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
